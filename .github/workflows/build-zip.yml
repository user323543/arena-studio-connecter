name: Build ZIP

# Baut das Release-ZIP (keine EXE mehr!) und testet den .bat-Starter auf Windows.
# Download: Repo -> Actions -> letzter Lauf -> Artifact "ArenaStudioConnector-zip"
# Oder: ein Tag wie v1.1.0 pushen -> ZIP + Pruefsumme landen am GitHub Release.

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Tests + ZIP (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: ZIP bauen
        run: python build_zip.py

      - name: Inhalt des ZIPs anzeigen
        run: python -m zipfile -l dist/ArenaStudioConnector-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaStudioConnector-zip
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: An Release haengen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

  windows:
    name: .bat-Starter auf Windows testen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Starter testen: /version, /help, /check (< nul verhindert Warten)"
        shell: pwsh
        run: |
          # Version direkt aus der Quelle lesen: /version muss sie exakt ausgeben
          $version = (Select-String -Path 'arena_studio_connector.py' `
                        -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Erwartete Version: $version"
          $log = "bat-smoke.txt"
          "Arena Studio Connector - .bat-Smoketest auf Windows" | Set-Content $log
          $erwartet = [ordered]@{
            '/version' = "Arena Studio Connector $version"
            '/help'    = 'Optionen:'
            '/check'   = '[OK] Python'
          }
          $fehler = @()
          foreach ($arg in $erwartet.Keys) {
            "`n===== ArenaStudioConnector.bat $arg =====" | Add-Content $log
            $out = cmd /c "ArenaStudioConnector.bat $arg < nul" 2>&1 | Out-String
            $out | Add-Content $log
            Write-Host $out
            if ($out -notmatch [regex]::Escape($erwartet[$arg])) {
              $fehler += $arg
              # Annotation: so steht die echte Ausgabe in der API (auch wenn
              # das Job-Log nicht abrufbar ist)
              $kurz = ($out -replace "\r?\n", " | ")
              if ($kurz.Length -gt 900) { $kurz = $kurz.Substring(0, 900) }
              Write-Host "::error title=Smoketest $arg::$kurz"
            }
          }
          if ($fehler.Count -gt 0) { throw "Starter-Test fehlgeschlagen bei: $($fehler -join ', ')" }

      - name: Bridge startet ohne Fenster und antwortet
        shell: pwsh
        run: |
          # Nur die Bridge pruefen (ohne cloudflared): --headless starten,
          # /api/status abfragen, wieder beenden.
          $log = "headless.log"
          "===== python arena_studio_connector.py --headless =====" | Set-Content $log
          $proc = Start-Process python -ArgumentList 'arena_studio_connector.py --headless' `
                    -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "headless.err"
          $token = $null
          foreach ($i in 1..25) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Bridge: http://127\.0\.0\.1:8765' -Quiet)) { break }
          }
          Get-Content $log | Write-Host
          $match = Select-String -Path $log -Pattern 'TOKEN=(\S+)'
          if ($match) {
            $token = $match.Matches[0].Groups[1].Value
            $status = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/status" `
                        -Headers @{ Authorization = "Bearer $token" }
            Write-Host "Bridge-Status: $($status.bridge), studio_connected=$($status.studio_connected)"
          }
          if (-not $proc.HasExited) { $proc.Kill() }
          if (-not $token) { throw "Headless-Bridge wurde nicht gestartet" }
          "`n===== Ausgabe oben, Bridge-Antwort: $($status.bridge) =====" | Add-Content "bat-smoke.txt"
          Get-Content $log | Add-Content "bat-smoke.txt"

      - name: Smoketest-Ausgabe als Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaStudioConnector-bat-smoketest
          path: |
            bat-smoke.txt
            headless.err
