name: Build ZIP

# Baut das Release-ZIP (keine EXE mehr!) und testet den .bat-Starter auf Windows.
# Download: Repo -> Actions -> letzter Lauf -> Artifact "ArenaStudioConnector-zip"
# Oder: ein Tag wie v1.1.0 pushen -> ZIP + Pruefsumme landen am GitHub Release.

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Tests + ZIP (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: ZIP bauen
        run: python build_zip.py

      - name: Inhalt des ZIPs anzeigen
        run: python -m zipfile -l dist/ArenaStudioConnector-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaStudioConnector-zip
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: An Release haengen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt

  windows:
    name: .bat-Starter auf Windows testen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zeilenenden der .bat pruefen (Windows-Checkout)
        shell: pwsh
        run: |
          # .gitattributes erzwingt CRLF - hier auf dem Windows-Checkout belegt.
          foreach ($f in @('ArenaStudioConnector.bat', 'ArenaStudioConnector-Konsole.bat', 'build_zip.bat')) {
            $text = [System.IO.File]::ReadAllText($f)
            $nurLf = ([regex]::Matches($text, "(?<!`r)`n")).Count
            if ($nurLf -gt 0) { throw "$f hat $nurLf LF-only-Zeilen - cmd braucht CRLF" }
            Write-Host "$f : CRLF ok"
          }

      - name: "Starter testen: /version, /help, /check (< nul verhindert Warten)"
        shell: pwsh
        run: |
          # Version direkt aus der Quelle lesen: /version muss sie exakt ausgeben
          $version = (Select-String -Path 'arena_studio_connector.py' `
                        -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Erwartete Version: $version"
          $log = "bat-smoke.txt"
          "Arena Studio Connector - .bat-Smoketest auf Windows" | Set-Content $log
          $erwartet = [ordered]@{
            '/version' = "Arena Studio Connector $version"
            '/help'    = 'Optionen:'
            '/check'   = '[OK] Python'
          }
          $fehler = @()
          foreach ($arg in $erwartet.Keys) {
            "`n===== ArenaStudioConnector.bat $arg =====" | Add-Content $log
            $out = cmd /c "ArenaStudioConnector.bat $arg < nul" 2>&1 | Out-String
            $out | Add-Content $log
            Write-Host $out
            if ($out -notmatch [regex]::Escape($erwartet[$arg])) {
              $fehler += $arg
              # Annotation: so steht die echte Ausgabe in der API (auch wenn
              # das Job-Log nicht abrufbar ist)
              $kurz = ($out -replace "\r?\n", " | ")
              if ($kurz.Length -gt 900) { $kurz = $kurz.Substring(0, 900) }
              Write-Host "::error title=Smoketest $arg::$kurz"
            }
          }
          if ($fehler.Count -gt 0) { throw "Starter-Test fehlgeschlagen bei: $($fehler -join ', ')" }

      - name: Diagnose.bat schreibt ein vollstaendiges Log (Fehlersuche)
        shell: pwsh
        run: |
          if (Test-Path diagnose_log.txt) { Remove-Item diagnose_log.txt }
          cmd /c "Diagnose.bat < nul" | Out-Null
          if (-not (Test-Path diagnose_log.txt)) { throw "Diagnose.bat hat kein Log geschrieben" }
          $log = Get-Content diagnose_log.txt -Raw
          Write-Host $log
          $kurz = ($log -replace "\r?\n", " | ")
          if ($kurz.Length -gt 950) { $kurz = $kurz.Substring(0, 950) }
          Write-Host "::warning title=Diagnose-Log::$kurz"
          foreach ($needle in @('Arena Studio Connector - Diagnose', '--- Dateien',
                                'OK    arena_studio_connector.py', '--- Python',
                                'Systemcheck', '[OK] Python')) {
            if ($log -notmatch [regex]::Escape($needle)) {
              throw "diagnose_log.txt unvollstaendig - fehlt: $needle"
            }
          }

      - name: "Studio-Plugin landet automatisch im Roblox-Plugin-Ordner (/plugin)"
        shell: pwsh
        run: |
          # Auf dem Runner ist Roblox nicht installiert - der Starter muss den
          # Plugin-Ordner trotzdem anlegen und das Plugin hineinschreiben.
          $pluginDir = Join-Path $env:LOCALAPPDATA "Roblox\Plugins"
          if (Test-Path $pluginDir) { Remove-Item $pluginDir -Recurse -Force }

          $out = cmd /c "ArenaStudioConnector.bat /plugin < nul" 2>&1 | Out-String
          Write-Host $out
          $ziel = Join-Path $pluginDir "ArenaBridgePlugin.lua"
          if (-not (Test-Path $ziel)) { throw "Plugin wurde nicht installiert: $ziel fehlt" }
          $lua = Get-Content $ziel -Raw
          if ($lua -match '__BRIDGE_TOKEN__|__BRIDGE_URL__') { throw "Platzhalter nicht ersetzt" }
          if ($lua -notmatch 'http://127\.0\.0\.1:8765') { throw "Bridge-URL fehlt im Plugin" }
          $token = (Get-Content "config.json" -Raw | ConvertFrom-Json).bridge_token
          if ($lua -notmatch [regex]::Escape($token)) { throw "Token aus config.json fehlt im Plugin" }
          Write-Host "OK: Plugin in $ziel installiert (Token gesetzt)"

          # Zweiter Lauf darf nichts neu schreiben und neuen Token erst auf Wunsch
          $vorher = (Get-Item $ziel).LastWriteTimeUtc
          $zweit = cmd /c "ArenaStudioConnector.bat /plugin < nul" 2>&1 | Out-String
          if ($zweit -notmatch 'aktuell') { throw "Zweiter Lauf hat nicht 'aktuell' gemeldet" }
          if ((Get-Item $ziel).LastWriteTimeUtc -ne $vorher) { throw "Datei unnoetig neu geschrieben" }

          $neu = cmd /c "ArenaStudioConnector.bat /newtoken < nul" 2>&1 | Out-String
          $neuerToken = (Get-Content "config.json" -Raw | ConvertFrom-Json).bridge_token
          if ($neuerToken -eq $token) { throw "/newtoken hat den Token nicht erneuert" }
          if ((Get-Content $ziel -Raw) -notmatch [regex]::Escape($neuerToken)) {
            throw "Plugin wurde nach /newtoken nicht aktualisiert"
          }
          Write-Host "OK: /newtoken rotiert und aktualisiert das Plugin"

      - name: "Starter-Standard: Token + URL anzeigen, Prompt in die Zwischenablage"
        shell: cmd
        run: |
          rem Ausgabe ueber cmd umleiten - robuster als PowerShell-Pipelines
          python tests/windows_smoke.py > windows_smoke.log 2>&1
          set RC=%errorlevel%
          type windows_smoke.log
          if not "%RC%"=="0" (
            powershell -NoProfile -Command "$t=(Get-Content windows_smoke.log -Raw) -replace '\r?\n',' | '; if($t.Length -gt 950){$t=$t.Substring($t.Length-950)}; Write-Host \"::error title=Smoke::$t\""
            exit /b %RC%
          )

      - name: Smoketest-Ausgabe als Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArenaStudioConnector-bat-smoketest
          path: |
            bat-smoke.txt
            diagnose_log.txt
