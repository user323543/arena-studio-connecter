name: Build Windows EXE

# Baut die EXE automatisch auf einem Windows-Runner.
#
# ⬇️ Schneller Direkt-Download (Release-Asset über GitHub-CDN, ohne Zip):
#    https://github.com/user323543/arena-studio-connecter/releases/latest/download/ArenaStudioConnector.exe
#    (wird bei jedem Push auf main automatisch aktualisiert)
#
# Fallback: Repo → Actions → letzter Lauf → Artifact "ArenaStudioConnector-exe"
#           (Zip über den Artifact-Dienst, startet langsamer)
#
# Noch kleinere/schnellere EXE: Actions → "Build Windows EXE" → Run workflow
#           → Option "use_upx" aktivieren (ca. halb so groß, kann aber bei
#             Virenscannern Fehlalarm auslösen – deshalb standardmäßig aus).
on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      use_upx:
        description: "EXE mit UPX packen (ca. halb so groß = schnellerer Download, evtl. Virenscanner-Fehlalarm)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: UPX installieren (optional, kleinere EXE)
        if: inputs.use_upx
        run: choco install upx -y --no-progress

      - name: EXE bauen
        run: |
          pip install --upgrade pyinstaller
          pyinstaller --noconfirm ArenaStudioConnector.spec

      - name: Größe der EXE anzeigen
        shell: bash
        run: ls -lh dist/ArenaStudioConnector.exe

      - name: Artifact als Fallback hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ArenaStudioConnector-exe
          path: |
            dist/ArenaStudioConnector.exe
            .env.example
            config.example.json
            README.md

      # --- Schneller Download: Release-Asset statt Artifact-Zip --------------
      - name: Release "latest" aktualisieren (nur main → immer neueste EXE)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/ArenaStudioConnector.exe \
            --target "${{ github.sha }}" \
            --title "ArenaStudioConnector.exe – neueste Version" \
            --notes "Automatischer Build von \`main\` (Commit ${{ github.sha }}).

          **Direkt-Download (schnell, ohne Zip):**
          https://github.com/${{ github.repository }}/releases/latest/download/ArenaStudioConnector.exe" \
            --latest
          echo "### ⬇️ Schneller Direkt-Download" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/ArenaStudioConnector.exe" >> "$GITHUB_STEP_SUMMARY"

      - name: Versioniertes Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArenaStudioConnector.exe
          make_latest: false
